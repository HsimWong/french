<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Français progressif — 语法 / 词汇学习平台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">F</span>
    <div>
      <div class="brand-title">Français progressif</div>
      <div class="brand-sub">A2 · B1 · 语法 / 词汇</div>
    </div>
  </div>
  <nav class="nav" id="nav">
    <a href="#/" data-route="/">学习台</a>
    <a href="#/dictionary" data-route="/dictionary">词典</a>
    <a href="#/chapters/1" data-route="/chapters">课程目录</a>
    <a href="#/chapter/1" data-route="/chapter">章节学习</a>
    <a href="#/exercise/1" data-route="/exercise">在线练习</a>
    <a href="#/notes" data-route="/notes">笔记汇总</a>
  </nav>
  <div class="topbar-right">
    <select id="course-switch" class="course-switch" aria-label="切换课程"></select>
    <span id="answer-badge"></span>
    <button type="button" id="auth-logout" class="btn btn-sm hidden" title="退出登录">退出</button>
  </div>
</header>

<main id="app" class="app"></main>

<div id="note-popover" class="note-popover hidden">
  <div class="popover-head">
    <span>为选中文本添加笔记</span>
    <button type="button" class="icon-btn" id="popover-close" aria-label="关闭">×</button>
  </div>
  <div class="popover-quote" id="popover-quote"></div>
  <textarea id="popover-text" rows="3" placeholder="写下你的笔记…"></textarea>
  <div class="popover-actions">
    <button type="button" class="btn btn-danger btn-sm hidden" id="popover-delete">删除</button>
    <button type="button" class="btn btn-primary" id="popover-save">保存笔记</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<aside id="dict-drawer" class="dict-drawer hidden" aria-label="词典与笔记" aria-live="polite">
  <div class="dict-head">
    <div>
      <div class="dict-kicker">DICTIONNAIRE · 查词与笔记</div>
      <div class="dict-query" id="dict-query"></div>
    </div>
    <button type="button" class="icon-btn" id="dict-close" aria-label="关闭词典">×</button>
  </div>
  <div class="dict-body">
    <section class="dict-result card">
      <div class="dict-result-head"><span>词典</span><span id="dict-source" class="dict-badge">查询中…</span></div>
      <div id="dict-result"></div>
    </section>
    <section class="note-panel">
      <div class="dict-result-head"><span>我的笔记</span><span id="note-state" class="dict-badge note-state">未保存</span></div>
      <div class="popover-quote" id="drawer-quote"></div>
      <textarea id="drawer-text" rows="4" placeholder="写下你的笔记…（保存后原文保持高亮）"></textarea>
      <div class="drawer-images" id="drawer-images"></div>
      <input type="file" id="drawer-image-file" accept="image/*" class="hidden">
      <div class="popover-actions">
        <button type="button" class="btn btn-sm" id="drawer-add-image" title="插入截图（自动压缩）">＋ 图片</button>
        <button type="button" class="btn btn-danger btn-sm hidden" id="drawer-delete">删除笔记</button>
        <button type="button" class="btn btn-primary" id="drawer-save">保存笔记</button>
      </div>
    </section>
  </div>
</aside>

<script type="module" src="js/app.js"></script>
<script>
  window.__fpErrors = [];
  window.addEventListener('error', e => {
    if (window.__fpErrors.length < 5) window.__fpErrors.push(String(e.message || e.error || ''));
  });
  window.addEventListener('unhandledrejection', e => {
    if (window.__fpErrors.length < 5) window.__fpErrors.push('rejection: ' + String(e.reason?.message || e.reason || ''));
  });
</script>
<script>
  // Keep the first uncaught module error visible for the #diag=1 health page.
  window.__fpErrors = [];
  window.addEventListener('error', e => {
    if (window.__fpErrors.length < 5) window.__fpErrors.push(String(e.message || e.error || ''));
  });
  window.addEventListener('unhandledrejection', e => {
    if (window.__fpErrors.length < 5) window.__fpErrors.push('rejection: ' + String(e.reason?.message || e.reason || ''));
  });
</script>
</body>
</html>
